# SRS 配置 —— 同时输出 HTTP-FLV（给 H5 app.html）与 HLS（给微信小程序 <video>）。
# LiveTalking 以 --transport rtmp 推流到本机 SRS，浏览器/小程序各取所需。
#
# 用法（一次性，用本 conf 重建容器）：
#   docker rm -f srs
#   docker run -d --name srs -p 1935:1935 -p 1985:1985 -p 8080:8080 \
#     -v /home/jiale/Desktop/Digital_Person/deploy/srs.conf:/usr/local/srs/conf/docker.conf \
#     registry.cn-hangzhou.aliyuncs.com/ossrs/srs:5 ./objs/srs -c conf/docker.conf
#
# 流地址（app=live, stream=livestream）：
#   FLV : http://<host>:8080/live/livestream.flv
#   HLS : http://<host>:8080/live/livestream.m3u8

listen              1935;
max_connections     200;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    # 关键：HLS/FLV 直播流加 CORS 头，浏览器跨源也能拉（小程序 native 无所谓，但 H5 需要）
    crossdomain     on;
}

rtc_server {
    enabled         off;
}

vhost __defaultVhost__ {
    # HTTP-FLV：低延迟，供 H5（mpegts.js）
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # HLS：供 iPhone Safari（原生 HLS）。供微信 <video> 那套已放弃。
    # 延迟 vs 平滑权衡（2026-07-02 调整）：iPhone/iOS 主路径使用 WebRTC 保证 <5s；
    # HLS 只作为兜底，因此窗口保持较短，避免兜底时固定落后十几秒。
    # 原 hls_window 3 缓冲偏浅，曾出现
    # 偶发音频卡顿、回答末尾卡帧——因 Ditto 推流为压低延迟保持 SDK 队列near-empty，
    # 产帧有微小空档，安卓 FLV/WebRTC 抖动缓冲能吸收、iOS 浅 HLS 吸收不了。故兜底窗口取 4
    # （约 4-6s 播放列表）。若 HLS 兜底仍卡顿，应优先修 WebRTC，不再扩大 HLS 作为主路径。
    # iPhone 本就非 <5s 主力（低延迟走安卓 FLV/APK ~1-3s）；HLS 协议难做真 <5s。
    hls {
        enabled         on;
        hls_fragment    1;
        hls_window      4;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
        hls_dispose     30;
        # 每个切片以关键帧开头（iOS 解码必需），SRS 等到关键帧再切片
        hls_wait_keyframe on;
        # 关键：关掉 SRS 5.0 默认的 HLS 会话跟踪。开启时 m3u8 会返回一层
        # 带 ?hls_ctx= 的跳转 playlist（含 EXT-X-STREAM-INF），微信 <video>
        # 会误当多码率 master 处理而加载失败。关掉后 m3u8 直接是 .ts 列表。
        hls_ctx         off;
        hls_ts_ctx      off;
    }
}
