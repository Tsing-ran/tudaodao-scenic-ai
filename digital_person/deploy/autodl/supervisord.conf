; 途叨叨 · AutoDL 全栈进程守护（supervisor）
; 背景：AutoDL 是容器、PID1=bash、无 systemd 作 init，故用 supervisor 做进程守护。
;   - autorestart=true：任一服务进程意外退出 → 自动拉起（补上"进程非常驻、死了要手动救"的最大稳定性缺口）。
;   - 不开机/登录自动启动：本机 GPU 与 SAM3 训练/ComfyUI 共用，数字人栈由 dp_up.sh 显式拉起，
;     supervisor 仅负责"拉起后保活"；dp_down.sh 一键全停，把 GPU 让给训练。
;   - 启动顺序用 priority（小先起）：SRS（媒体总线，其余推/拉它）→ RAG → LiveTalking×2 → 桥接 → 中继。
;   - killasgroup/stopasgroup=true：停服时连子进程（ffmpeg 等）一起清，确保 GPU 真正释放、端口不残留。
; 用法：supervisord -c /root/autodl-tmp/supervisord.conf  （见 dp_up.sh / dp_down.sh / preflight.sh）

[unix_http_server]
file=/root/autodl-tmp/supervisor.sock
chmod=0700

[supervisord]
logfile=/root/autodl-tmp/supervisord.log
logfile_maxbytes=20MB
logfile_backups=3
pidfile=/root/autodl-tmp/supervisord.pid
childlogdir=/root/autodl-tmp
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/autodl-tmp/supervisor.sock

; ── 公共默认（每个 program 继承习惯：自启、自重启、退出连子进程一起清）────────────
; supervisor 无"模板继承"，下面每个 program 显式写，但策略一致。

[program:srs]
command=/root/autodl-tmp/srs/trunk/objs/srs -c conf/srs_dp.conf
directory=/root/autodl-tmp/srs/trunk
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/srs.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true

[program:rag]
command=/root/miniconda3/bin/python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000
directory=/root/autodl-tmp/Digital_Person
environment=DEPLOY_MODE="cloud"
priority=20
autostart=true
autorestart=true
startsecs=8
startretries=5
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/rag.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true

; LiveTalking 16:9（手机端，:8010）。lt_run.sh 内已 export DASHSCOPE/DITTO/LD_LIBRARY_PATH。
; 进程秒级存活即视为 started（startsecs=20）；真正出流约 85s，由 preflight 查 SRS publish 确认。
[program:livetalking_main]
command=bash /root/autodl-tmp/lt_run.sh
directory=/root/autodl-tmp/LiveTalking
priority=30
autostart=true
autorestart=true
startsecs=20
startretries=3
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/lt.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true

; LiveTalking 9:16（大屏立屏，:8011）
[program:livetalking_portrait]
command=bash /root/autodl-tmp/lt_run_portrait.sh
directory=/root/autodl-tmp/LiveTalking
priority=31
autostart=true
autorestart=true
startsecs=20
startretries=3
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/lt_portrait.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true

[program:bridge]
command=/root/miniconda3/bin/python -m uvicorn bridge.server:app --host 0.0.0.0 --port 6006
directory=/root/autodl-tmp/Digital_Person
environment=RAG_BASE="http://127.0.0.1:8000",LIVETALKING_BASE="http://127.0.0.1:8010",LIVETALKING_BASE_2="http://127.0.0.1:8011"
priority=40
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/bridge.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true

; 北京→杭州 RTMP 中继。relay_hz.sh 自带 while-true 内层重连；supervisor 再兜一层（双保险）。
[program:relay_hz]
command=bash /root/autodl-tmp/relay_hz.sh
directory=/root/autodl-tmp
priority=50
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/relay_hz.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true
