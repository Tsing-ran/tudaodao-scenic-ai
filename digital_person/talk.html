<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智游·导览 — 数字人</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  body{font-family:-apple-system,"PingFang SC",sans-serif;background:#0b1020;color:#e2e8f0;
       min-height:100vh;display:flex;flex-direction:column;}
  header{padding:10px 14px;background:#111a33;display:flex;align-items:center;gap:10px;}
  header b{font-size:15px;}
  header select{margin-left:auto;background:#1e293b;color:#e2e8f0;border:none;padding:6px 8px;border-radius:6px;font-size:13px;}
  .stage{position:relative;background:#000;width:100%;aspect-ratio:9/16;max-height:62vh;overflow:hidden;}
  .stage video{width:100%;height:100%;object-fit:contain;background:#000;}
  .badge{position:absolute;top:10px;left:10px;font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(0,0,0,.55);z-index:2;}
  .badge.on{background:rgba(22,163,74,.85);} .badge.off{background:rgba(220,38,38,.8);}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;}
  .overlay button{background:#2563eb;color:#fff;border:none;padding:14px 26px;border-radius:30px;font-size:16px;font-weight:700;}
  .pills{position:absolute;bottom:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;}
  .pill{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(37,99,235,.85);}
  .pill.emo{background:rgba(245,158,11,.85);} .pill.tm{background:rgba(15,23,42,.85);}
  .panel{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px;}
  .reply{background:#111a33;border-radius:10px;padding:12px;font-size:15px;line-height:1.6;min-height:60px;
         white-space:pre-wrap;word-break:break-word;}
  .ask{display:flex;gap:8px;}
  .ask input{flex:1;padding:12px;border:1px solid #243049;border-radius:10px;background:#0f1730;color:#e2e8f0;font-size:15px;}
  .ask button{background:#2563eb;color:#fff;border:none;padding:0 18px;border-radius:10px;font-size:15px;font-weight:600;}
  .ask button:disabled{opacity:.4;}
  .ask button.mic{background:#0f1730;border:1px solid #243049;color:#e2e8f0;padding:0 14px;font-size:19px;}
  .ask button.mic.listening{border-color:#2563eb;background:#13224a;}
  .ask button.mic.recording{background:#dc2626;border-color:#dc2626;color:#fff;animation:pulse 1s infinite;}
  .ask button.mic.recognizing{background:#f59e0b;border-color:#f59e0b;color:#fff;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .hint{font-size:12px;color:#64748b;text-align:center;}
</style>
</head>
<body>
<header>
  <b>🏯 灵境·导览</b>
  <select id="scenic">
    <option value="lingshan">灵山胜境</option>
    <option value="nihuawan">拈花湾</option>
    <option value="xihu">西湖</option>
    <option value="huangshan">黄山</option>
    <option value="gugong">故宫</option>
  </select>
</header>

<div class="stage">
  <video id="video" autoplay playsinline muted controls></video>
  <span class="badge off" id="badge">未连接</span>
  <div class="overlay" id="overlay"><button onclick="connect()">▶ 连接数字人</button></div>
  <div class="pills" id="pills"></div>
</div>

<div class="panel">
  <div class="reply" id="reply">连接数字人后，在下方提问，TA 会开口回答。</div>
  <div class="ask">
    <input id="msg" placeholder="问点什么，如：灵山大佛有多高？" onkeydown="if(event.key==='Enter')ask()">
    <button id="cam" class="mic" onclick="$('camfile').click()" disabled title="拍照定位">📷</button>
    <button id="mic" class="mic" onclick="toggleVoice()" disabled title="语音提问">🎤</button>
    <button id="send" onclick="ask()" disabled>问</button>
  </div>
  <input type="file" id="camfile" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(this.files[0])">
  <div class="hint" id="hint">画面默认静音，点视频上的 🔊 取消静音</div>
</div>

<script>
const $=id=>document.getElementById(id);
const HOST=location.hostname;
const BR='http://'+HOST+':9000';                          // 桥接层
const FLV=BR+'/stream.flv';                                // 经桥接反代的 HTTP-FLV（带 CORS，绕开 SRS 跨源拦截）
const sessionid='0';                                      // RTMP 模式单路固定 sessionid
let player=null;

function setBadge(t,c){ const b=$('badge'); b.textContent=t; b.className='badge '+(c||''); }

// ── 连接：用 mpegts.js 播放 SRS 的 HTTP-FLV 流（绕开 WebRTC）──────
function connect(){
  $('overlay').style.display='none'; setBadge('连接中…','');
  if(window.mpegts){ startPlay(); return; }
  // 从 LiveTalking(:8010) 取 mpegts.js
  const s=document.createElement('script');
  s.src='http://'+HOST+':8010/mpegts-1.7.3.min.js';
  s.onload=startPlay;
  s.onerror=()=>{ setBadge('播放器加载失败','off'); $('overlay').style.display='flex'; };
  document.head.appendChild(s);
}
function startPlay(){
  if(!window.mpegts||!mpegts.isSupported()){ setBadge('浏览器不支持FLV','off'); return; }
  player=mpegts.createPlayer({type:'flv',url:FLV,isLive:true,enableStashBuffer:false});
  player.attachMediaElement($('video'));
  player.load();
  player.play().then(()=>{ $('video').muted=false; }).catch(()=>{});
  setBadge('已连接 ●','on'); $('send').disabled=false; $('mic').disabled=false; $('cam').disabled=false;
  $('hint').textContent='🎤 语音提问 · 📷 拍照定位讲解 · 或打字提问';
  setTimeout(greet, 1500);   // 连上后稍候，让数字人主动开口迎宾
}

// ── 主动迎宾：连接成功后数字人微笑打招呼+自我介绍+邀请 ──────────
let greeted=false;
async function greet(){
  if(greeted) return; greeted=true;
  try{
    const g=await (await fetch(`/trip/greeting?scenic_id=${$('scenic').value}&group_type=adult`)).json();
    if(g.text){
      $('reply').textContent=g.text;
      $('pills').innerHTML='<span class="pill emo">主动迎宾</span>';
      fetch(BR+'/live/say',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({sessionid,text:g.text,scenic_id:$('scenic').value})}).catch(()=>{});
    }
  }catch(e){/* 迎宾失败不影响主流程 */}
}

// ── 提问 → 桥接 /live/ask → 数字人开口（注入到这路直播流）──────
async function ask(){
  const msg=$('msg').value.trim(); if(!msg) return;
  if(!player){ alert('请先连接数字人'); return; }
  $('send').disabled=true; $('pills').innerHTML=''; $('reply').textContent='思考中…';
  const t0=Date.now();
  try{
    const r=await fetch(BR+'/live/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sessionid,message:msg,scenic_id:$('scenic').value})});
    const d=await r.json();
    if(!r.ok){ $('reply').textContent='出错：'+(d.detail||r.status); return; }
    const dt=((Date.now()-t0)/1000).toFixed(1);
    $('reply').textContent=d.reply||'(无回答)';
    $('pills').innerHTML=`<span class="pill">意图 ${d.intent||'-'}</span>`
      +`<span class="pill emo">情绪 ${d.emotion||'-'}</span>`
      +`<span class="pill tm">⏱ ${dt}s</span>`;
    $('msg').value='';
  }catch(e){ $('reply').textContent='请求失败：'+e.message; }
  finally{ $('send').disabled=false; }
}

// ── 语音输入 + VAD 自动断句 ───────────────────────────────────────
// 能量检测 VAD：实时算麦克风音频 RMS，检测到说话→开始计时；
// 说完静音保持 SILENCE_HOLD 毫秒即判定一句话结束→自动停录→转写→自动发问。
// 零依赖、离线可用、移动端兼容（对标 OpenAvatarChat 的 Silero-VAD 角色，能量版）。
let micState='idle', mediaStream=null, mr=null, chunks=[], audioCtx=null, rafId=null, wantTranscribe=false;
function setMic(s){ micState=s; const b=$('mic');
  b.className='mic'+(s==='idle'?'':' '+s);
  b.textContent = s==='recognizing' ? '⏳' : '🎤';
}
async function toggleVoice(){
  if(micState!=='idle'){ stopVoice(false); return; }   // 再点一次 = 取消
  try{
    mediaStream=await navigator.mediaDevices.getUserMedia({audio:{noiseSuppression:true,echoCancellation:true}});
  }catch(e){ alert('麦克风不可用（需 localhost 或 HTTPS 访问）：'+e.message); return; }
  chunks=[]; wantTranscribe=false;
  mr=new MediaRecorder(mediaStream);
  mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  mr.onstop=onRecStop;
  mr.start();
  setMic('listening'); $('hint').textContent='请说话…（说完会自动识别）';

  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const src=audioCtx.createMediaStreamSource(mediaStream);
  const an=audioCtx.createAnalyser(); an.fftSize=512; src.connect(an);
  const buf=new Uint8Array(an.fftSize);
  // 阈值与时序（演示环境调过的经验值）
  // SILENCE_HOLD：说完静音多久判定一句结束。500ms 省 ~0.3s 端到端延迟，
  // 适合游客短问句；若出现「话没说完被打断」，调回 650~800。
  const VOICE_TH=0.018, MIN_SPEECH=300, SILENCE_HOLD=500, MAX_MS=12000;
  let spoke=false, speechStart=0, lastVoice=performance.now(), t0=performance.now();
  function loop(){
    if(micState==='idle') return;
    an.getByteTimeDomainData(buf);
    let sum=0; for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; sum+=v*v; }
    const rms=Math.sqrt(sum/buf.length), now=performance.now();
    if(rms>VOICE_TH){ lastVoice=now; if(!spoke){ spoke=true; speechStart=now; setMic('recording'); } }
    if(spoke && (now-speechStart)>MIN_SPEECH && (now-lastVoice)>SILENCE_HOLD){ stopVoice(true); return; }
    if((now-t0)>MAX_MS){ stopVoice(spoke); return; }   // 兜底上限，防卡死
    rafId=requestAnimationFrame(loop);
  }
  rafId=requestAnimationFrame(loop);
}
function stopVoice(transcribe){
  wantTranscribe=transcribe;
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  if(audioCtx){ audioCtx.close().catch(()=>{}); audioCtx=null; }
  if(mr && mr.state!=='inactive'){ mr.stop(); }        // 触发 onRecStop
  else { cleanupMic(); }
}
function cleanupMic(){ if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; } }
async function onRecStop(){
  cleanupMic();
  if(!wantTranscribe || !chunks.length){ setMic('idle'); $('hint').textContent='🎤 点麦克风语音提问，或打字提问'; return; }
  setMic('recognizing'); $('hint').textContent='识别中…';
  const fd=new FormData();
  fd.append('file', new Blob(chunks,{type:'audio/webm'}), 'voice.webm');
  fd.append('scenic_id', $('scenic').value);
  try{
    const r=await fetch('/asr',{method:'POST',body:fd});  // 同源 :8000，直接 /asr
    const d=await r.json();
    setMic('idle');
    if(d.text && d.text.trim()){ $('msg').value=d.text.trim(); ask(); }   // 识别成功 → 自动发问
    else { $('reply').textContent='没听清，请再说一次'; $('hint').textContent='🎤 再试一次'; }
  }catch(e){ setMic('idle'); $('reply').textContent='识别失败：'+e.message; }
}
// ── 拍照视觉定位 + 口语指路（创新三 / AR-lite）──────────────────
// 拍照 → /chat/image 出「定位+讲解+指路」文字 + 📍位置 → 桥接 /live/say 让数字人开口说
async function onPhoto(file){
  if(!file) return;
  if(!player){ alert('请先连接数字人'); return; }
  $('cam').disabled=true; $('pills').innerHTML=''; $('reply').textContent='识别画面中…';
  const t0=Date.now();
  try{
    const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
    const b64=dataUrl.slice(dataUrl.indexOf(',')+1);
    const m=/data:image\/(\w+);/.exec(dataUrl); const fmt=m?m[1]:'jpeg';
    const r=await fetch('/chat/image',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_id:'talk',scenic_id:$('scenic').value,image_b64:b64,image_format:fmt,
        question:'我面前是什么？帮我定位、讲解，并指引我接下来去哪。'})});
    const d=await r.json();
    if(!r.ok){ $('reply').textContent='出错：'+(d.detail||r.status); return; }
    const dt=((Date.now()-t0)/1000).toFixed(1);
    $('reply').textContent=d.reply||'(无结果)';
    $('pills').innerHTML=(d.location?`<span class="pill">📍 ${d.location}</span>`:`<span class="pill emo">未定位</span>`)
      +`<span class="pill emo">情绪 ${d.emotion||'-'}</span>`+`<span class="pill tm">⏱ ${dt}s</span>`;
    if(d.reply){ fetch(BR+'/live/say',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sessionid,text:d.reply,scenic_id:$('scenic').value})}).catch(()=>{}); }
  }catch(e){ $('reply').textContent='识别失败：'+e.message; }
  finally{ $('cam').disabled=false; $('camfile').value=''; }
}
</script>
</body>
</html>
