<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 背景渐变：深夜蓝 → 青山绿 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>

    <!-- 金色光晕渐变 -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0"/>
    </radialGradient>

    <!-- 山峦渐变 -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.6"/>
    </linearGradient>

    <!-- 文字金色渐变 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- 裁剪圆形 -->
    <clipPath id="circle">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>

    <!-- 外圈描边渐变 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#f5c842"/>
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 底圆 -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)"/>

  <!-- 金色光晕 -->
  <circle cx="100" cy="82" r="55" fill="url(#glowGrad)" clip-path="url(#circle)"/>

  <!-- 水面反光横线组 -->
  <g clip-path="url(#circle)" opacity="0.18">
    <line x1="20" y1="148" x2="180" y2="148" stroke="#2dd4bf" stroke-width="1"/>
    <line x1="30" y1="154" x2="170" y2="154" stroke="#2dd4bf" stroke-width="0.7"/>
    <line x1="40" y1="160" x2="160" y2="160" stroke="#2dd4bf" stroke-width="0.5"/>
  </g>

  <!-- 远山（最远，最浅） -->
  <g clip-path="url(#circle)">
    <path d="M 10,145 L 45,108 L 75,128 L 100,100 L 125,122 L 155,105 L 190,140 L 190,170 L 10,170 Z"
          fill="#1a4a6e" opacity="0.5"/>
  </g>

  <!-- 中山 -->
  <g clip-path="url(#circle)">
    <path d="M 0,160 L 35,120 L 60,138 L 90,112 L 115,130 L 145,108 L 170,125 L 200,155 L 200,175 L 0,175 Z"
          fill="url(#mountainGrad)" opacity="0.65"/>
  </g>

  <!-- 近山（最深，最实） -->
  <g clip-path="url(#circle)">
    <path d="M 0,175 L 30,148 L 55,162 L 80,138 L 100,150 L 120,133 L 148,155 L 170,142 L 200,165 L 200,200 L 0,200 Z"
          fill="#0e4b5a" opacity="0.85"/>
  </g>

  <!-- 山顶光点（峰顶微光） -->
  <g filter="url(#softGlow)">
    <circle cx="100" cy="150" r="2" fill="#f5c842" opacity="0.6"/>
    <circle cx="80" cy="138" r="1.5" fill="#f5c842" opacity="0.4"/>
    <circle cx="120" cy="133" r="1.5" fill="#f5c842" opacity="0.4"/>
  </g>

  <!-- AI电路线（横穿中部，科技感） -->
  <g clip-path="url(#circle)" opacity="0.25" stroke="#2dd4bf" stroke-width="0.8" fill="none">
    <polyline points="15,95 40,95 45,88 55,88 60,95 85,95"/>
    <polyline points="115,95 140,95 145,88 155,88 160,95 185,95"/>
    <circle cx="100" cy="95" r="2.5" fill="#2dd4bf" opacity="0.5" stroke="none"/>
  </g>

  <!-- 核心"灵"字 -->
  <text x="100" y="95"
        font-family="'Noto Serif SC', 'Songti SC', STSong, serif"
        font-size="52"
        font-weight="700"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="url(#textGrad)"
        filter="url(#glow)"
        letter-spacing="1">灵</text>

  <!-- 副标题"导览" -->
  <text x="100" y="120"
        font-family="'Noto Serif SC', 'Songti SC', STSong, serif"
        font-size="13"
        font-weight="400"
        text-anchor="middle"
        fill="#94d5c8"
        letter-spacing="6"
        opacity="0.9">导  览</text>

  <!-- 外圈描边 -->
  <circle cx="100" cy="100" r="96"
          fill="none"
          stroke="url(#borderGrad)"
          stroke-width="2"
          opacity="0.7"/>

  <!-- 内圈细线 -->
  <circle cx="100" cy="100" r="90"
          fill="none"
          stroke="#2dd4bf"
          stroke-width="0.5"
          opacity="0.3"/>
</svg>
