<!DOCTYPE html>
<!-- 图：三层漏斗（缓存→GPU池→降级 · Visio 风格）。源文件。渲染宽≈2240 → {width≈78%}。 -->
<html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="_kit.css">
<style>
  .fig{width:2240px;}
  .col{display:flex;flex-direction:column;align-items:center;}
  .start{border-radius:40px;border:3px solid #5b6775;background:#f1f3f5;color:#2c3440;
    font-size:58px;font-weight:700;padding:18px 56px;white-space:nowrap;}
  .tier{width:100%;display:flex;align-items:stretch;border-radius:16px;border:3px solid var(--c);
    background:var(--tint);box-shadow:4px 7px 13px rgba(60,70,85,0.22);overflow:hidden;}
  .tier .cond{flex:0 0 760px;background:var(--c);color:#fff;display:flex;align-items:center;
    gap:22px;padding:24px 32px;}
  .tier .cond .tn{font-size:64px;font-weight:700;flex:0 0 auto;}
  .tier .cond .ct{font-size:56px;font-weight:700;line-height:1.22;white-space:nowrap;}
  .tier .out{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;
    gap:8px;padding:22px 36px;}
  .tier .out .ol{font-size:56px;color:#222834;line-height:1.3;white-space:nowrap;}
  .tier .out .os{font-size:46px;color:#5b6675;white-space:nowrap;}
  .fall{display:flex;align-items:center;justify-content:center;gap:20px;padding:14px 0;}
  .fall .lbl{font-size:48px;font-weight:700;color:#46505e;white-space:nowrap;}
  .end{width:100%;text-align:center;border-radius:16px;border:3px solid #1f9b6c;background:#1f9b6c;
    color:#fff;font-size:62px;font-weight:700;padding:24px;box-shadow:4px 6px 12px rgba(60,70,85,0.24);}
</style></head><body>
<div class="fig"><div class="col">

  <div class="start">游客提问</div>
  <div class="fall"><svg width="50" height="50"><line x1="25" y1="2" x2="25" y2="32" stroke="#5a6473" stroke-width="6"/><polygon points="25,50 14,30 36,30" fill="#5a6473"/></svg></div>

  <div class="tier c-green">
    <div class="cond"><div class="tn">①</div><div class="ct">高频问答缓存命中</div></div>
    <div class="out"><div class="ol">播放预渲染数字人视频</div><div class="os">0 GPU · 0 LLM · &lt;0.5s，吃掉大部分请求</div></div>
  </div>
  <div class="fall"><svg width="50" height="50"><line x1="25" y1="2" x2="25" y2="32" stroke="#5a6473" stroke-width="6"/><polygon points="25,50 14,30 36,30" fill="#5a6473"/></svg><span class="lbl">未命中</span></div>

  <div class="tier c-blue">
    <div class="cond"><div class="tn">②</div><div class="ct">GPU 池有空闲渲染槽</div></div>
    <div class="out"><div class="ol">抢占渲染槽，实时驱动</div><div class="os">占 1 路 · 说完即放 · &lt;5s 开口，长尾与个性化问答</div></div>
  </div>
  <div class="fall"><svg width="50" height="50"><line x1="25" y1="2" x2="25" y2="32" stroke="#5a6473" stroke-width="6"/><polygon points="25,50 14,30 36,30" fill="#5a6473"/></svg><span class="lbl">池满或离线</span></div>

  <div class="tier c-orange">
    <div class="cond"><div class="tn">③</div><div class="ct">满载降级兜底</div></div>
    <div class="out"><div class="ol">先秒回文字或语音答</div><div class="os">突发高峰，绝不卡顿</div></div>
  </div>
  <div class="fall"><svg width="50" height="50"><line x1="25" y1="2" x2="25" y2="32" stroke="#5a6473" stroke-width="6"/><polygon points="25,50 14,30 36,30" fill="#5a6473"/></svg></div>

  <div class="end">人人 &lt;5s 得到答复</div>

</div></div></body></html>
