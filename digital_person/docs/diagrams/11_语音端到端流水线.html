<!DOCTYPE html>
<!-- 图：语音端到端流水线（竖向阶段流 · 延迟预算）。源文件。渲染宽≈1680 → {width≈58%}。 -->
<html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="_kit.css">
<style>
  .fig{width:1680px;}
  .flow{display:flex;flex-direction:column;align-items:center;}
  .stage{width:100%;display:flex;align-items:center;gap:28px;border-radius:16px;
    border:3px solid var(--c);background:var(--tint);box-shadow:4px 6px 12px rgba(60,70,85,0.20);
    padding:22px 34px;}
  .badge{flex:0 0 auto;width:84px;height:84px;border-radius:50%;background:var(--c);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:50px;font-weight:700;}
  .sname{flex:1 1 0;font-size:60px;color:#222834;white-space:nowrap;}
  .stime{flex:0 0 auto;font-size:52px;font-weight:700;color:var(--c);background:#fff;
    border:3px solid var(--c);border-radius:30px;padding:4px 26px;white-space:nowrap;}
  .end{width:100%;text-align:center;border-radius:16px;border:3px solid #1f9b6c;background:#1f9b6c;
    color:#fff;font-size:62px;font-weight:700;padding:24px;box-shadow:4px 6px 12px rgba(60,70,85,0.24);}
  .note{margin-top:34px;border-left:14px solid #e67e22;background:#fdf3e7;border-radius:10px;
    padding:26px 34px;display:flex;flex-direction:column;gap:10px;}
  .note .nl{font-size:52px;color:#5a4326;line-height:1.34;white-space:nowrap;}
  .down svg{display:block;}
</style></head><body>
<div class="fig"><div class="flow">
  <div class="stage c-blue"><div class="badge">①</div><div class="sname">VAD 静音判定</div><div class="stime">0.8s</div></div>
  <div class="adown"><svg width="50" height="50"><line x1="25" y1="2" x2="25" y2="32" stroke="#5a6473" stroke-width="6"/><polygon points="25,50 14,30 36,30" fill="#5a6473"/></svg></div>
  <div class="stage c-blue"><div class="badge">②</div><div class="sname">ASR 语音转文字</div><div class="stime">约 1.0s</div></div>
  <div class="adown"><svg width="50" height="50"><line x1="25" y1="2" x2="25" y2="32" stroke="#5a6473" stroke-width="6"/><polygon points="25,50 14,30 36,30" fill="#5a6473"/></svg></div>
  <div class="stage c-teal"><div class="badge">③</div><div class="sname">RAG 检索（自研优化）</div><div class="stime">0.3–1.2s</div></div>
  <div class="adown"><svg width="50" height="50"><line x1="25" y1="2" x2="25" y2="32" stroke="#5a6473" stroke-width="6"/><polygon points="25,50 14,30 36,30" fill="#5a6473"/></svg></div>
  <div class="stage c-teal"><div class="badge">④</div><div class="sname">LLM 首句流式生成</div><div class="stime">1.0–1.5s</div></div>
  <div class="adown"><svg width="50" height="50"><line x1="25" y1="2" x2="25" y2="32" stroke="#5a6473" stroke-width="6"/><polygon points="25,50 14,30 36,30" fill="#5a6473"/></svg></div>
  <div class="stage c-purple"><div class="badge">⑤</div><div class="sname">TTS 首块合成</div><div class="stime">约 0.35s</div></div>
  <div class="adown"><svg width="50" height="50"><line x1="25" y1="2" x2="25" y2="32" stroke="#5a6473" stroke-width="6"/><polygon points="25,50 14,30 36,30" fill="#5a6473"/></svg></div>
  <div class="stage c-purple"><div class="badge">⑥</div><div class="sname">数字人首帧渲染（Ditto 全脸）</div><div class="stime">0.72s</div></div>
  <div class="adown"><svg width="50" height="50"><line x1="25" y1="2" x2="25" y2="32" stroke="#5a6473" stroke-width="6"/><polygon points="25,50 14,30 36,30" fill="#5a6473"/></svg></div>
  <div class="end">数字人开口　·　端到端约 4.7s（＜5s）</div>
  <div class="note">
    <div class="nl">串行链路：总延迟 = 各段之和</div>
    <div class="nl">③ 检索与 ④ 生成由本系统掌控，是延迟优化主战场</div>
  </div>
</div></div></body></html>
